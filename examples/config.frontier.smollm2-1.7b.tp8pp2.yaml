# --- Frontier (OLCF) validation deployment ---------------------------------
# SmolLM2-1.7B-Instruct (LlamaForCausalLM): one replica, TP=8 inside each node
# x PP=2 across two nodes (16 GCDs).  Frontier is validation-only: no measured
# scale envelope, so validation_mode must stay true.  PP needs a sharded
# checkpoint with a *.safetensors.index.json (docs/deploy_frontier.md).
#
# Submit from a login node after preparing the stack (docs/deploy_frontier.md):
#   source /path/to/frontier_submit.env
#   exaserve-serve-submit examples/config.frontier.smollm2-1.7b.tp8pp2.yaml \
#       --queue extended --qos debug --walltime 00:30:00 --project-account PROJECT

validation_mode: true
vendor: rocm
ray_port: 6379
node_cpus: 56
num_nodes: 2
num_gpus_per_node: 8
model_storage_path: /lustre/orion/PROJECT/world-shared/USER/exaserve-frontier/models # ! Change this
local_stage_path: /mnt/bb/USER/exaserve # ! node-local NVMe; requires --constraint=nvme
deployment_name: exaserve_serve
replica_max_ongoing_requests: 128
models:
    - model_id: HuggingFaceTB/SmolLM2-1.7B-Instruct
      tensor_parallel_size: 8
      pipeline_parallel_size: 2
      max_model_len: 4096
      size: 2
      gpu_memory_utilization: 0.85
      enforce_eager: true
      max_num_seqs: 64

gateway:
  kind: haproxy
  port: 4001
  backend_port: 8000
  worker_count: 1
  options:
    balance: leastconn
    maxconn: 8000
    check_interval: 5000
    stats_port: 0
