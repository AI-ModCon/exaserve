# --- LiteLLM-fronted deployment ------------------------------------------
# A LiteLLM proxy runs on the head node and exposes an OpenAI-compatible
# API with API-key auth, rate limiting, usage tracking, and model-aware
# routing. Clients hit http://<head>:4001/v1/... with Authorization.
#
# Requires a separate LiteLLM virtual environment, because LiteLLM pins
# different dependency versions than Ray/vLLM. Build one that pins LiteLLM
# and set executable_ref to its `litellm` script (the launcher runs it
# directly).
#
# Run with (docs/getting_started.md describes the variables):
#   export EXASERVE_ENV_SCRIPT_AURORA=/absolute/path/to/environment.sh
#   export EXASERVE_PROJECT_ROOT=/lus/flare/projects/YOUR_PROJECT
#   exaserve-serve-submit examples/config.litellm.yaml --project-account YOUR_PROJECT
# The batch job must also find EXASERVE_LITELLM_MASTER_KEY (gateway.options.
# master_key below) in its own environment, or the launcher refuses to start
# LiteLLM. The job does not inherit the submitting shell; set the key where the
# job reads it, for example in a private (mode 600) file that your shell
# profile sources.

ray_port: 6379
node_cpus: 64
num_nodes: 2
validation_mode: true
model_storage_path: /lus/flare/projects/YOUR_PROJECT/YOUR_USER/models # ! Change this
local_stage_path: /tmp/hf_home
deployment_name: exaserve_serve
replica_max_ongoing_requests: 32
num_gpus_per_node: 12
models:
    - model_id: meta-llama/Meta-Llama-3-8B-Instruct
      tensor_parallel_size: 1
      pipeline_parallel_size: 1
      max_model_len: 4096
      size: 8
      gpu_memory_utilization: 0.90
      enforce_eager: true
      max_num_seqs: 64

gateway:
  kind: litellm
  port: 4001
  backend_port: 8000

  # Absolute path of the `litellm` script in your LiteLLM virtual
  # environment. The launcher runs it directly.
  executable_ref: /path/to/litellm-venv/bin/litellm

  # uvicorn worker count, passed to LiteLLM as --num_workers. LiteLLM starts
  # every worker before it binds its port: on Aurora that took 51 s with one
  # worker and 59 s with eight, and the compiler gives the gateway at least
  # 120 s to start. The paper's LiteLLM runs used eight workers.
  worker_count: 1
  options:
    master_key: {secret_ref: "ENV:EXASERVE_LITELLM_MASTER_KEY"}
    routing_strategy: least-busy # least-busy | simple-shuffle | latency-based-routing
    num_retries: 2
    timeout: 300
