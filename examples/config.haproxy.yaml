# --- HAProxy-fronted deployment ------------------------------------------
# A single HAProxy runs on the head node and load-balances across every
# Ray Serve HTTP proxy. Clients hit http://<head>:4001/. Pure L7 routing;
# no API keys or usage tracking. Best performance baseline.
#
# Requires haproxy on $PATH; Aurora provides none, so build it with
# scripts/build_haproxy.sh on a compute node.
#
# This is a production configuration. Its submission currently fails closed
# with "production execution is not qualified" (see docs/hardening/STATUS.md).
#
# Run with (docs/getting_started.md describes the variables):
#   export EXASERVE_ENV_SCRIPT_AURORA=/absolute/path/to/environment.sh
#   export EXASERVE_PROJECT_ROOT=/lus/flare/projects/YOUR_PROJECT
#   exaserve-serve-submit examples/config.haproxy.yaml --project-account YOUR_PROJECT

ray_port: 6379
node_cpus: 64
num_nodes: 2
model_storage_path: /lus/flare/projects/YOUR_PROJECT/YOUR_USER/models # ! Change this
local_stage_path: /tmp/hf_home
deployment_name: exaserve_serve
replica_max_ongoing_requests: 128
num_gpus_per_node: 12
models:
    - model_id: meta-llama/Meta-Llama-3-8B-Instruct
      tensor_parallel_size: 1
      pipeline_parallel_size: 1
      max_model_len: 4096
      size: 8
      gpu_memory_utilization: 0.90
      enforce_eager: true
      max_num_seqs: 64

gateway:
  kind: haproxy
  port: 4001          # HAProxy front-end port (clients connect here)
  backend_port: 8000  # Ray Serve HTTP port on each node
  worker_count: 1
  options:
    balance: leastconn   # leastconn | roundrobin | random
    maxconn: 8000
    check_interval: 5000 # ms between backend health probes
    stats_port: 9999     # HAProxy stats page (0 disables)
