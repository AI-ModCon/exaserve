name: nullcompute_scaling_val
# EXP SET 3 — control-plane null-compute, push past 256 nodes.
# Replicas short-circuit the forward pass (null_compute), isolating serve.run's
# control plane from model loading. startup_only=true (no replay); the data is
# the bring-up itself. instrumentation=true stages the overlay probes so we get
# GetActorInfo counts + per-proxy ray.get_actor timing alongside scaling_trace's
# wait_proxies / deploy_apps.
#
# This pilot is the single n256_r12 cell (N = 256 nodes, R = 12 replicas per
# node); full/nullcompute_scaling holds the (N, R) matrix.
#
# !!! READ BEFORE SUBMITTING !!!
#  - The cell needs more than debug-scaling's 1h cap (256n serve.run is ~31min
#    and grows superlinearly), so it runs on prod with a 3 h walltime.
#  - VALIDATE n256_r12 before any larger cell of the full matrix.
matrix:
  name_template: 'n{num_nodes}_r{num_gpus_per_node}'
  combine: cartesian
  axes:
  - name: num_nodes
    values: [256]
    targets: [deployment.num_nodes, scheduler.nodes]
    label_template: 'n{value}'
  - name: num_gpus_per_node
    values: [12]
    targets: [deployment.num_gpus_per_node]
    label_template: 'r{value}'
  derived:
  - path: client.num_nodes
    expr: 'num_nodes'
  - path: scheduler.walltime
    expr: '"03:00:00"'
trace:
  kind: weak_scaling
workload:
  duration: 1.0
  input_len: 64
  output_len: 64
  rate_per_node: 1.0
  generation_mode: deterministic
deployment:
  num_gpus_per_node: 12
  models:
  - model_id: meta-llama/Meta-Llama-3-8B-Instruct
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    max_model_len: 4096
    size: 8
    num_cpus_per_replica: 1
    gpu_memory_utilization: 0.90
    enforce_eager: true
    max_num_seqs: 64
  replica_max_ongoing_requests: 256
client:
  num_runs: 1
  startup_only: true
  dest: proxy
  stream: false
  num_go_procs: 1
  num_go_workers: 4
backend:
  default: ray
  args:
    ray:
      launch:
        ray_node_cpus: 64
        clean_stage: true
        null_compute: true
        instrumentation: true
      proxy:
        type: haproxy
        port: 4001
        backend_port: 8000
        num_workers: 1
        options:
          balance: leastconn
          maxconn: 8000
scheduler:
  type: pbs
  queue: prod
