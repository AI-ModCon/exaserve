name: direct_topology
# WHY THIS EXPERIMENT
# In the paper's direct-dispatch STREAMING baseline, per-node completions fall
# from about 99 QPS/node at one node to 71 at 256 nodes, while non-streaming
# direct dispatch holds about 106. The paper attributes the decline to the
# fixed measurement window: requests are still draining when injection stops,
# and the slowest node's drain grows with node count (section IV-C). This spec
# checks whether the routing topology of direct dispatch contributes as well.
# With direct_dispatch: mesh, each client rank picks
#   target = fnv1a64(req_id) % len(base_urls)
# over ALL N node URLs, so direct dispatch is a full N x N mesh -- every node
# streams SSE to N remote peers.
#
# ARMS (all three replayed against ONE bring-up, results/<arm>/):
#   mesh   - rank hash-routes across all N nodes
#   local  - rank hits only its own node: loopback, one peer, zero fabric
#   paired - rank hits exactly one REMOTE node: still crosses the fabric, but
#            one peer per node instead of N
# local vs mesh separates cross-node token delivery from everything that scales
# with the cluster (Ray/GCS control plane, which is identical in all arms).
# paired vs local then separates the fabric crossing itself from per-node peer
# fan-out. Offered load is 110 QPS/node in every arm.
matrix:
  name_template: 'n{num_nodes}'
  axes:
  - name: num_nodes
    values: [128, 192]
    targets: [deployment.num_nodes, client.num_nodes, scheduler.nodes]
    label_template: '{value}_nodes'
  derived:
  - path: scheduler.queue
    expr: '"capacity" if num_nodes <= 16 else ("prod" if num_nodes >= 256 else "debug-scaling")'
  - path: scheduler.walltime
    expr: '"02:00:00" if num_nodes <= 16 else ("02:30:00" if num_nodes >= 256 else "01:00:00")'
trace:
  kind: weak_scaling
workload:
  duration: 60.0
  input_len: 64
  output_len: 64
  rate_per_node: 110.0
  arrival: fixed
  generation_mode: deterministic
deployment:
  models:
  - model_id: meta-llama/Meta-Llama-3-8B-Instruct
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    max_model_len: 4096
    size: 8
    gpu_memory_utilization: 0.90
    enforce_eager: true
    max_num_seqs: 64
  replica_max_ongoing_requests: 256
  collect_stats: true
client:
  # 2 runs per arm (run0 warm-up, run1 data) x 3 arms keeps the whole ablation
  # inside the 1h debug-scaling walltime even at 192 nodes, where serve.run
  # alone takes about 10-15 min.
  num_runs: 2
  dest: direct
  stream: true
  num_go_procs: 8
  num_go_workers: 4
  dispatch_topologies: [mesh, local, paired]
backend:
  default: ray
  args:
    ray:
      launch:
        ray_node_cpus: 64
        clean_stage: true
      proxy:
        type: none
scheduler:
  type: pbs
