name: proxycmp_direct_nostream_scale
# EXP SET 1 (proxy comparison) — Direct-MPI dispatch (one client per node hits
# its LOCAL Ray Serve port; no shared proxy). Zero-LB upper bound: proxy type
# none, dest direct, num_go_procs=8 (each rank owns a node). Non-streaming
# (stream=false): each request returns its full completion in one response, so
# results carry end-to-end latency, throughput and errors, not TTFT or TBT.
# Scale axis is [128,256]; proxycmp_direct_nostream covers 1-64 nodes.
matrix:
  name_template: 'n{num_nodes}'
  axes:
  - name: num_nodes
    values: [128, 256]
    targets: [deployment.num_nodes, client.num_nodes, scheduler.nodes]
    label_template: '{value}_nodes'
  derived:
  - path: scheduler.queue
    expr: '"capacity" if num_nodes <= 16 else ("prod" if num_nodes >= 256 else "debug-scaling")'
  - path: scheduler.walltime
    expr: '"02:00:00" if num_nodes <= 16 else ("02:30:00" if num_nodes >= 256 else "01:00:00")'
trace:
  kind: weak_scaling
workload:
  duration: 60.0
  input_len: 64
  output_len: 64
  rate_per_node: 110.0
  arrival: fixed
  generation_mode: deterministic
deployment:
  models:
  - model_id: meta-llama/Meta-Llama-3-8B-Instruct
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    max_model_len: 4096
    size: 8
    gpu_memory_utilization: 0.90
    enforce_eager: true
    max_num_seqs: 64
  replica_max_ongoing_requests: 256
  collect_stats: true
client:
  num_runs: 6
  dest: direct
  stream: false
  num_go_procs: 8
  num_go_workers: 4
backend:
  default: ray
  args:
    ray:
      launch:
        ray_node_cpus: 64
        clean_stage: true
      proxy:
        type: none
scheduler:
  type: pbs
