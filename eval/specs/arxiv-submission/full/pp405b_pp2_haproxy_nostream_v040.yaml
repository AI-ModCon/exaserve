name: pp405b_pp2_haproxy_nostream_v040
# Current-infrastructure two-pass paper curve: Llama-3.1-405B-Instruct,
# TP=8 x PP=2, one replica per two physical nodes, HAProxy, non-streaming.
# The offered load remains fixed at 0.4 request/s per PP replica.
matrix:
  name_template: 'n{num_nodes}'
  axes:
  - name: num_nodes
    values: [4, 8, 16, 32, 64, 128, 256]
    targets: [deployment.num_nodes, scheduler.nodes]
    label_template: '{value}_nodes'
  derived:
  - path: deployment.models.0.num_replicas
    expr: 'num_nodes // 2'
  - path: client.num_nodes
    expr: 'min(num_nodes, 4)'
  - path: scheduler.queue
    expr: '"capacity" if num_nodes <= 16 else ("prod" if num_nodes >= 256 else "debug-scaling")'
  # A cold run needs 60-75 min (head-side model verification plus staging alone
  # take about 47 min), so cells below 256 nodes request 2 h and 256 nodes 4 h.
  # Aurora's debug-scaling queue allows at most 1 h, so submit and submit-all
  # refuse the 17-255-node cells before contacting the scheduler instead of
  # letting them be killed after staging. The 32-, 64- and 128-node cells can
  # run together as the children of the prod256 allocation campaign
  # (python3 -m eval.cli allocation ...), which needs a passed qualification
  # campaign first; otherwise change the scheduler.queue expression above to a
  # reservation queue.
  - path: scheduler.walltime
    expr: '"04:00:00" if num_nodes >= 256 else "02:00:00"'
trace:
  kind: weak_scaling
workload:
  duration: 120.0
  input_len: 64
  output_len: 64
  rate_per_node: 0.2
  arrival: fixed
  generation_mode: deterministic
deployment:
  validation_mode: true
  num_nodes: 4
  control:
    watchdog_cleanup_deadline_s: 900.0
  readiness:
    initial_deadline_s: 7200.0
    recovery_deadline_s: 3600.0
    canary_timeout_s: 300.0
  model_storage_path: /lus/flare/projects/YOUR_PROJECT/YOUR_USER/models
  local_stage_path: /tmp/pp405b_shard
  models:
  - model_id: meta-llama/Llama-3.1-405B-Instruct
    tensor_parallel_size: 8
    pipeline_parallel_size: 2
    num_replicas: 2
    max_model_len: 4096
    size: 405
    # 0.90 left effectively zero KV blocks on one otherwise usable Aurora
    # tile at n16 (6.6 GiB free after the 405B weights/runtime footprint).
    # The workload uses max_num_seqs=8, so 0.95 supplies a bounded cache margin
    # without changing the offered-load or parallelism contract.
    gpu_memory_utilization: 0.95
    enforce_eager: true
    max_num_seqs: 8
  replica_max_ongoing_requests: 16
client:
  num_runs: 2
  dest: proxy
  stream: false
  num_nodes: 4
  num_go_procs: 4
  num_go_workers: 4
  go_concurrency: 256
  request_timeout_s: 3600.0
  drain_wait_timeout_s: 3780.0
backend:
  default: ray
  args:
    ray:
      launch:
        ray_node_cpus: 64
        clean_stage: true
      proxy:
        type: haproxy
        port: 4001
        backend_port: 8000
        num_workers: 1
        options:
          balance: leastconn
          maxconn: 8000
scheduler:
  type: pbs
