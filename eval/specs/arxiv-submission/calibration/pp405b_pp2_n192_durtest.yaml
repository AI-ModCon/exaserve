name: pp405b_pp2_n192_durtest
# The duration test of pp405b_pp2_n16_durtest at 192 nodes (96 replicas), an
# intermediate scale point. It varies ONLY the run duration:
#   - dur120 = the sweep's window
#   - dur300 = a longer window; if the efficiency drop is a ramp-and-drain
#     artifact of the fixed window, the fixed overhead amortizes and overall
#     efficiency rises toward the steady-state value, while steady-state
#     throughput stays flat.
# Direct dispatch (no proxy), as in the 405B direct-dispatch sweep.
matrix:
  name_template: 'dur{duration}'
  axes:
  - name: duration
    values: [120, 300]
    targets: [workload.duration]
    label_template: 'dur{value}'
trace:
  kind: weak_scaling
workload:
  duration: 120.0            # overridden per matrix point
  input_len: 64
  output_len: 64
  rate_per_node: 0.2         # 0.4 rps/replica, identical to the sweep
  arrival: fixed
  generation_mode: deterministic
deployment:
  num_nodes: 192             # 96 replicas (PP=2), the intermediate scale point
  model_storage_path: /lus/flare/projects/YOUR_PROJECT/YOUR_USER/models
  local_stage_path: /tmp/pp405b_shard
  models:
  - model_id: meta-llama/Llama-3.1-405B-Instruct
    tensor_parallel_size: 8
    pipeline_parallel_size: 2
    num_replicas: 96
    max_model_len: 4096
    size: 405
    gpu_memory_utilization: 0.90
    enforce_eager: true
    max_num_seqs: 8
  replica_max_ongoing_requests: 16
client:
  num_runs: 2                # run0 warmup (discard) + run1 measured, as in the sweep
  dest: direct
  direct_dispatch: mesh      # PP exposes 96 replica routes across 192 deployment nodes
  stream: true
  num_go_procs: 8
  num_go_workers: 4
  go_concurrency: 256
backend:
  default: ray
  args:
    ray:
      launch:
        ray_node_cpus: 64
      proxy:
        type: none
        backend_port: 8000
scheduler:
  type: pbs
  nodes: 192
  # A cold 405B run needs more than an hour, so this requests 2 h. Aurora's
  # debug-scaling queue allows at most 1 h, so submit and submit-all refuse
  # this spec before contacting the scheduler; run it as a child of an
  # allocation campaign (python3 -m eval.cli allocation ...).
  queue: debug-scaling
  walltime: '02:00:00'
