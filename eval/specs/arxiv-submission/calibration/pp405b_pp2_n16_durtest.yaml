name: pp405b_pp2_n16_durtest
# Tests whether the 405B weak-scaling efficiency drop is an artifact of the
# fixed measurement window (paper section IV-C). Throughput is requests over
# wall-clock time, and wall-clock time includes draining the requests still in
# flight when the 120 s injection stops. Each replica is offered 0.4
# requests/s, about 6.9 concurrent requests against max_num_seqs=8, so excess
# requests queue for a decode cycle, and the slowest replica's drain grows with
# the replica count.
#
# TEST: hold scale FIXED at 16 nodes (8 replicas) and vary ONLY the injection
# duration T. If the drop is the window artifact, efficiency rises along
# T / (T + drain) with a roughly constant drain; a flat result would contradict
# that explanation. 16 nodes fit the capacity queue with a 2 h walltime.
matrix:
  name_template: 'dur{duration}'
  axes:
  - name: duration
    values: [120, 300, 600]
    targets: [workload.duration]
    label_template: 'dur{value}'
trace:
  kind: weak_scaling
workload:
  duration: 120.0            # overridden per matrix point
  input_len: 64
  output_len: 64
  rate_per_node: 0.2         # 0.4 rps/replica, identical to the sweep
  arrival: fixed
  generation_mode: deterministic
deployment:
  num_nodes: 16              # 8 replicas (PP=2) -> capacity queue
  model_storage_path: /lus/flare/projects/YOUR_PROJECT/YOUR_USER/models
  local_stage_path: /tmp/pp405b_shard
  models:
  - model_id: meta-llama/Llama-3.1-405B-Instruct
    tensor_parallel_size: 8
    pipeline_parallel_size: 2
    num_replicas: 8
    max_model_len: 4096
    size: 405
    gpu_memory_utilization: 0.90
    enforce_eager: true
    max_num_seqs: 8          # unchanged: the queueing headroom under test
  replica_max_ongoing_requests: 16
client:
  num_runs: 2                # run0 warmup (discard) + run1 measured, as in the sweep
  dest: direct               # proxy removed, as in the direct-dispatch sweep
  direct_dispatch: mesh      # PP exposes 8 replica routes across 16 deployment nodes
  stream: true
  num_go_procs: 8
  num_go_workers: 4
  go_concurrency: 256
backend:
  default: ray
  args:
    ray:
      launch:
        ray_node_cpus: 64
      proxy:
        type: none
        backend_port: 8000
scheduler:
  type: pbs
  nodes: 16
  queue: capacity
  walltime: '02:00:00'
